name: transition_journal
description: Private, offline-first HRT diary for transgender and gender-diverse people.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  share_plus: ^11.0.0
  equatable: ^2.0.7
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.1
  build_runner: ^2.4.15
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
